# Editorial "paper" theme. Tokens mirror app/ui/theme.py and app/assets/style.css — one
# palette, three consumers (Streamlit widgets, the Plotly template, the HTML components) —
# and the BI pack's Excel / Power BI themes.
[theme]
base = "light"
primaryColor = "#1D3FBB"
backgroundColor = "#F7F5F0"
secondaryBackgroundColor = "#EFEBE3"
codeBackgroundColor = "#F1EEE7"
textColor = "#191919"
linkColor = "#1D3FBB"
borderColor = "#E3DED5"
codeTextColor = "#3A3732"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Newsreader':https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "12.5px"
headingFontSizes = ["40px", "28px", "22px", "18px", "15px", "13px"]
headingFontWeights = [400, 400, 500, 600, 600, 600]
linkUnderline = false

greenColor = "#2E7D4F"
redColor = "#C04A32"
yellowColor = "#B7791F"
orangeColor = "#B7791F"
blueColor = "#1D3FBB"
violetColor = "#6B7FD7"
grayColor = "#8A857C"

# Accent first, then the validated outcome colours, then context greys.
chartCategoricalColors = [
    "#1D3FBB", "#6B7FD7", "#2E7D4F", "#C04A32", "#B7791F", "#A39E94", "#5F5B54", "#C9C3B8",
]
chartSequentialColors = [
    "#F1EEE7", "#DCE3FA", "#C2CEF5", "#9AABEB", "#7B91E0",
    "#5C77D6", "#3F5DCB", "#2E4EC3", "#1D3FBB", "#162F8C",
]

dataframeBorderColor = "#E3DED5"
dataframeHeaderBackgroundColor = "#F1EEE7"

[theme.sidebar]
backgroundColor = "#F1EEE7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#191919"
borderColor = "#E3DED5"
primaryColor = "#1D3FBB"

[server]
headless = true
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
