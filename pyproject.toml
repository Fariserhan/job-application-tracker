[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtracker"
version = "2.0.0"
description = "Gmail-to-warehouse job application analytics: deterministic email parsing, a dbt/DuckDB star schema, a Streamlit app and a Power BI / Tableau / Excel pack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faris Erhan" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.1",
    "plotly>=5.22",
    "streamlit>=1.40",
    "openpyxl>=3.1",
    "requests>=2.31",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]
dbt = ["dbt-core>=1.10", "dbt-duckdb>=1.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "playwright>=1.44"]

[project.scripts]
jobtracker = "jobtracker.cli:main"

[tool.setuptools.packages.find]
include = ["jobtracker*"]

[tool.setuptools.package-data]
jobtracker = ["warehouse/sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".venv", "dbt/target", "dbt/dbt_packages", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
files = ["jobtracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["jobtracker"]
omit = ["jobtracker/gmail/auth.py"]
