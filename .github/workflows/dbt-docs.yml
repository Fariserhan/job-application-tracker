name: Publish dbt docs

# Publishes the dbt documentation site (model lineage, column docs, tests) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      JOBTRACKER_WAREHOUSE: ${{ github.workspace }}/demo_data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: python -m jobtracker demo --dir demo_data
      - name: Generate docs
        working-directory: dbt
        run: |
          dbt build --profiles-dir . --project-dir .
          dbt docs generate --static --profiles-dir . --project-dir .
          mkdir -p ../site && cp target/static_index.html ../site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
